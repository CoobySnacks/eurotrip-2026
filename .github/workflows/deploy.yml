name: Deploy to GitHub Pages

# Every push to main republishes the site. Editing data/trip.json
# from a phone is enough to change the trip — this does the rest.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate trip.json
        run: |
          python3 - <<'PY'
          import json, sys

          with open('data/trip.json', encoding='utf-8') as f:
              D = json.load(f)

          errs = []

          # every venue reference must resolve
          venues = set(D['venues'])
          for day in D['days']:
              for b in day['blocks']:
                  if b.get('venue') and b['venue'] not in venues:
                      errs.append(f"{day['date']}: unknown venue '{b['venue']}'")
                  for s in b.get('suggestions', []) + b.get('subStops', []):
                      if s.get('venue') and s['venue'] not in venues:
                          errs.append(f"{day['date']}: unknown venue '{s['venue']}'")

          # every day needs its question set
          for day in D['days']:
              q = day.get('questions', {})
              if len(q.get('trivia', [])) < 1:
                  errs.append(f"{day['date']}: no trivia questions")
              if len(q.get('discussion', [])) < 1:
                  errs.append(f"{day['date']}: no discussion questions")

          # every city referenced by a day must exist
          for day in D['days']:
              if day['cityKey'] not in D['cities']:
                  errs.append(f"{day['date']}: unknown city '{day['cityKey']}'")

          # times must be HH:MM
          import re
          for day in D['days']:
              for b in day['blocks']:
                  if not re.fullmatch(r'\d{2}:\d{2}', b.get('time', '')):
                      errs.append(f"{day['date']}: bad time '{b.get('time')}' on '{b.get('title')}'")

          # A card must not claim a confirmation and also read as unconfirmed.
          # This happened for real: the Sep 2 Makhens transfer kept a stale
          # "Not yet confirmed" warning after the booking came through, so the
          # card showed a confirmation number directly above a red 🔴.
          STALE = re.compile(
              r'not yet|not booked|rebooking|to be confirmed|not confirmed'
              r'|awaiting|booking in progress', re.I)

          for day in D['days']:
              for b in day['blocks']:
                  text = ' '.join(str(b.get(k, '')) for k in ('title', 'desc', 'note', 'warn'))
                  if (b.get('conf') or b.get('res')) and STALE.search(text):
                      errs.append(
                          f"{day['date']} {b.get('time')}: '{b.get('title')}' has a confirmation "
                          f"but still reads as unconfirmed — clear the stale warning")
                  if 'TBD' in str(b.get('title', '')) and (b.get('conf') or b.get('res')):
                      errs.append(
                          f"{day['date']} {b.get('time')}: marked TBD but carries a confirmation")

          for t in D.get('transfers', []):
              text = ' '.join(str(t.get(k, '')) for k in ('label', 'cost', 'note'))
              if t.get('status') in ('paid', 'confirmed') and STALE.search(text):
                  errs.append(f"transfer '{t.get('label')}' is {t['status']} but reads as unconfirmed")

          # The check above only fires when a block carries a confirmation, which
          # missed a real case: the Sep 5 arrival still said "booking in progress"
          # after London was confirmed, because that block has no conf field.
          # So: if every transfer is settled, no transfer block anywhere may read
          # as unbooked. A pending *time change* is fine — the ride still exists.
          UNBOOKED = re.compile(
              r'booking in progress|not booked|not yet confirmed|rebooking'
              r'|confirmation number pending', re.I)
          if all(t.get('status') in ('paid', 'confirmed') for t in D.get('transfers', [])):
              for day in D['days']:
                  for b in day['blocks']:
                      if b.get('type') != 'transfer':
                          continue
                      text = ' '.join(str(b.get(k, '')) for k in ('title', 'desc', 'note', 'warn'))
                      if UNBOOKED.search(text):
                          errs.append(
                              f"{day['date']} {b.get('time')}: transfer block reads as unbooked, "
                              f"but every transfer is settled")

          # Venues that were dropped must be INVISIBLE — not struck through, not
          # explained. The site is the plan, not a changelog of what got cut.
          # These kept reappearing in backup lists and stray notes, so CI blocks them.
          BANNED = [
              'Café de Jaren', 'Cannibale', 'Restaurant BLACK', 'Loetje', 'Café Hoppe',
              'Das Loft', 'Palmenhaus', 'Kleinod', 'Dignita', 'DeDakkas', 'Ye Grapes',
              'Balderdash', 'Waterhole', 'Blue Boat', 'Changing of the Guard',
              'V&A', 'Sixt', 'JK Executive', 'Foodhallen', 'Sexy Fish', 'Park Chinois',
              'The Harp', 'Old Coffee House', 'Chandos', 'Clachan', 'Three Greyhounds',
              'Red Lion',
          ]
          ASIDES = ['double-booked', 'considered, not chosen', 'Malmö dropped',
                    'stall list correction', 'is cut —', 'was cut', 'Replaces ']

          blob = json.dumps(D, ensure_ascii=False)
          for name in BANNED:
              if name in blob:
                  errs.append(f"'{name}' was cut from the trip but still appears in trip.json")
          for aside in ASIDES:
              if aside in blob:
                  errs.append(f"leftover explanatory aside in trip.json: '{aside}'")

          if errs:
              print('❌ trip.json validation failed:')
              for e in errs:
                  print('  -', e)
              sys.exit(1)

          print(f"✅ trip.json OK — {len(D['days'])} days, {len(D['venues'])} venues, "
                f"{sum(len(d['blocks']) for d in D['days'])} blocks")
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
