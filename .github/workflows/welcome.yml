name: Welcome push (fires once, when all three are in)

# Polls every 30 minutes until Coob, Jared and Grant are all registered,
# sends the "we're all here" push, then commits `.welcome-sent` so it can
# never fire twice.
#
# The marker lives in the repo rather than KV on purpose: it survives a
# revoked Cloudflare token, and it's visible in git history.
#
# Cadence: every 10 minutes tonight while Grant is likely to sign up, then
# every 30 minutes from tomorrow lunchtime onward. Times are UTC — CDT is
# UTC−5, so 00:00–16:59 UTC on Aug 7 is 7 PM Aug 6 → 11:59 AM Aug 7 Central.
#
# GitHub's scheduler is best-effort: */10 frequently lands 15–20 minutes
# apart under load, and runs can be dropped entirely. Fine here — the send
# is idempotent, so a late or repeated check costs nothing.
#
# Stops polling after the trip starts — the cron day range retires it.

on:
  schedule:
    - cron: '*/10 0-16 7 8 *'    # tonight → tomorrow noon Central, every 10 min
    - cron: '*/30 17-23 7 8 *'   # rest of Aug 7, every 30 min
    - cron: '*/30 * 8-26 8 *'    # Aug 8 onward, every 30 min
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check who is registered, send nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cheap early exit so the scheduled runs cost almost nothing
      - id: check
        run: |
          if [ -f .welcome-sent ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Already sent — skipping."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.done == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: steps.check.outputs.done == 'false'
        run: pip install --quiet pywebpush requests

      - if: steps.check.outputs.done == 'false'
        id: send
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          PUSH_API:          ${{ secrets.PUSH_API }}
          PUSH_ADMIN_TOKEN:  ${{ secrets.PUSH_ADMIN_TOKEN }}
          DRY_RUN:           ${{ inputs.dry_run }}
        run: python scripts/send_welcome.py

      - if: steps.send.outputs.SENT == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .welcome-sent
          git commit -m "Welcome push sent — all three registered"
          git push
