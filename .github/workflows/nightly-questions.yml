name: Nightly questions push

# ── 8:00 PM LOCAL, in whatever city we're in that night ──
#
# GitHub Actions cron is ALWAYS UTC. Summer 2026 offsets:
#   Vienna / Copenhagen / Amsterdam = CEST = UTC+2  →  8 PM local = 18:00 UTC
#   London                          = BST  = UTC+1  →  8 PM local = 19:00 UTC
#
#   Aug 27–29  Vienna      ┐
#   Aug 30–31  Copenhagen  ├─ 18:00 UTC
#   Sep  1     Copenhagen  │
#   Sep  2–4   Amsterdam   ┘
#   Sep  5–7   London      →  19:00 UTC
#
# Aug 26 is the exception: 8 PM Dallas time is 20 minutes after wheels-up,
# and a push sent to a plane doesn't disappear — it queues and lands when
# the first phone reconnects at Heathrow the next morning. So night one
# fires at 6:00 PM CDT instead, while they're in the Terminal D lounge.
#   6 PM CDT (UTC-5) = 23:00 UTC on Aug 26.
#
# Sep 8 (flying home) is skipped entirely.
#
# Note: GitHub's scheduler can run a few minutes late under load. The
# site unlocks the questions on its own at 8 PM local regardless, so a
# late notification is cosmetic, not load-bearing.


# ⚠️ SCHEDULE DISABLED — Cloudflare owns the timing now.
#
# GitHub Actions cron is best-effort. On this repo an every-10-minutes
# schedule was measured running 202 minutes apart, which is fatal for
# "leave in 15 minutes" alerts and unreliable for the 8 PM questions.
#
# The Worker (worker/worker.js) runs every 5 minutes on a Cloudflare cron
# trigger and sends everything: the morning countdown, the per-block
# itinerary alerts, the daily agenda and the nightly questions. It dedupes
# in KV so nothing double-sends.
#
# This workflow is kept for MANUAL runs only (workflow_dispatch). Do not
# re-enable the schedule without removing the Worker's cron, or every
# notification goes out twice.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD) — leave blank for today'
        required: false
      dry_run:
        description: 'Print what would be sent, send nothing'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install push libraries
        run: pip install --quiet pywebpush requests

      - name: Send tonight's questions
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          PUSH_API:          ${{ secrets.PUSH_API }}
          PUSH_ADMIN_TOKEN:  ${{ secrets.PUSH_ADMIN_TOKEN }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          OVERRIDE_DATE:     ${{ inputs.date }}
          DRY_RUN:           ${{ inputs.dry_run }}
        run: python scripts/send_push.py
